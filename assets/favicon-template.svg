{{/*
Stop colors and gradient focal point are passed from head.html, which
already computes them for the CSS seasonal palette. See head.html.
Offsets are tuned per stop count: a front-loaded ramp ending at 85%,
finished by a translucent repeat of the last stop to fade the rim.

Browsers evaluate the media query below against their own theme (favicons
render outside the page), swapping the gradient to the dark palette.
*/}}
{{- $offsets := index (dict
  "4" (slice "0%" "35%" "60%" "85%")
  "5" (slice "0%" "30%" "50%" "70%" "85%")
) (printf "%d" (len .LightStops)) -}}
<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <style>
    @media (prefers-color-scheme: dark) {
      {{- range $i, $color := .DarkStops }}
      .s{{ add $i 1 }} { stop-color: {{ $color }}; }
      {{- end }}
    }
  </style>
  <defs>
    <radialGradient id="season" cx="{{ .Cx }}" cy="{{ .Cy }}" r="75%">
      {{- range $i, $color := .LightStops }}
      <stop class="s{{ add $i 1 }}" offset="{{ index $offsets $i }}" stop-color="{{ $color }}" />
      {{- end }}
      <stop class="s{{ len .LightStops }}" offset="100%" stop-color="{{ index .LightStops (sub (len .LightStops) 1) }}" stop-opacity="0.6" />
    </radialGradient>
  </defs>
  <circle cx="50" cy="50" r="50" fill="url(#season)"/>
</svg>
