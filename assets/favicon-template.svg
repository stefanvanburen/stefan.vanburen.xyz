{{/*
Stop colors and gradient focal point are passed from head.html, which
already computes them for the CSS seasonal palette. See head.html.
The radial layout uses exactly four stops; any extra stops in a season's
list (winter has five) are ignored.

Browsers evaluate the media query below against their own theme (favicons
render outside the page), swapping the gradient to the dark palette.
*/}}
<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <style>
    @media (prefers-color-scheme: dark) {
      .s1 { stop-color: {{ index .DarkStops 0 }}; }
      .s2 { stop-color: {{ index .DarkStops 1 }}; }
      .s3 { stop-color: {{ index .DarkStops 2 }}; }
      .s4 { stop-color: {{ index .DarkStops 3 }}; }
    }
  </style>
  <defs>
    <radialGradient id="season" cx="{{ .Cx }}" cy="{{ .Cy }}" r="75%">
      <stop class="s1" offset="0%" stop-color="{{ index .LightStops 0 }}" />
      <stop class="s2" offset="35%" stop-color="{{ index .LightStops 1 }}" />
      <stop class="s3" offset="60%" stop-color="{{ index .LightStops 2 }}" />
      <stop class="s4" offset="85%" stop-color="{{ index .LightStops 3 }}" />
      <stop class="s4" offset="100%" stop-color="{{ index .LightStops 3 }}" stop-opacity="0.6" />
    </radialGradient>
  </defs>
  <circle cx="50" cy="50" r="50" fill="url(#season)"/>
</svg>
