image: alpine/latest
packages:
  - hugo
oauth: pages.sr.ht/PAGES:RW
environment:
  site: stefan.vanburen.xyz
tasks:
  - build: |
      cd stefan.vanburen.xyz
      hugo --minify

      tar -C public -cvz . > site.tar.gz
  - upload: |
      cd stefan.vanburen.xyz
      acurl -f https://pages.sr.ht/publish/$site -Fcontent=@site.tar.gz
