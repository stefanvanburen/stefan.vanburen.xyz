image: alpine/latest
packages:
  - hugo
oauth: pages.sr.ht/PAGES:RW
environment:
  site: svbn.srht.site
sources:
  - https://git.sr.ht/~svbn/svbn.me
tasks:
  - build: |
      cd svbn.me
      hugo --minify
      tar -C public -cvz . > site.tar.gz
  - upload: |
      cd svbn.me
      acurl -f https://pages.sr.ht/publish/$site -Fcontent=@site.tar.gz
