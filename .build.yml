image: alpine/latest
packages:
  - go
  - hugo
oauth: pages.sr.ht/PAGES:RW
environment:
  site: stefan.vanburen.xyz
tasks:
  - build-hugo: |
      cd stefan.vanburen.xyz
      hugo --minify

      tar -C public -cvz . > site-hugo.tar.gz

  - build-gmni: |
      cd stefan.vanburen.xyz
      # this installs gmnhg to /home/build/stefan.vanburen.xyz/bin
      GOBIN=$PWD/bin go install github.com/tdemin/gmnhg/cmd/gmnhg@latest
      ./bin/gmnhg

      tar -C output -cvz . > site-gmni.tar.gz

  - upload: |
      cd stefan.vanburen.xyz

      # Only upload on the main branch.
      if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD)" ]
      then
        echo "Not on main branch, not publishing!"
        exit 0
      fi

      acurl -f https://pages.sr.ht/publish/$site -Fcontent=@site-hugo.tar.gz
      acurl -f https://pages.sr.ht/publish/svbn.srht.site -Fcontent=@site-hugo.tar.gz
      acurl -f https://pages.sr.ht/publish/$site -Fcontent=@site-gmni.tar.gz -Fprotocol=GEMINI
