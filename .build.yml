image: alpine/latest
packages:
  - hugo
oauth: pages.sr.ht/PAGES:RW
environment:
  site: stefan.vanburen.xyz
tasks:
  - build: |
      cd stefan.vanburen.xyz
      hugo --minify

      tar -C public -cvz . > site.tar.gz

  - upload: |
      cd stefan.vanburen.xyz

      current_branch=$(git branch --show-current)

      # Only upload on the main branch.
      if [ "$(current_branch)" != "main" ]
      then
        echo "Current branch is " $(current_branch) ", not publishing site!"
        exit 0
      fi

      acurl -f https://pages.sr.ht/publish/$site -Fcontent=@site.tar.gz
