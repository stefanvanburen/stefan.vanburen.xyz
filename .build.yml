image: alpine/edge
packages:
  - hugo
  - hut
  - just
  - rsvg-convert
oauth: pages.sr.ht/PAGES:RW
environment:
  site: stefan.vanburen.xyz
tasks:
  # Build on every branch, exactly as `just publish` would, so what's
  # verified is what ships: minified, with the apple-touch-icon rasterized.
  - build: |
      cd $site
      just build
  - publish: |
      cd $site
      # Only upload on the main branch.
      if [ "$GIT_REF" != "refs/heads/main" ]
      then
        echo "Not on main branch, not publishing!"
        exit 0
      fi
      # Uploads public/ from the build task rather than rebuilding it.
      just upload
