image: alpine/edge
packages:
  - rsync
  - hugo
oauth: pages.sr.ht/PAGES:RW
environment:
  site: svbn.srht.site
sources:
  - https://git.sr.ht/~zetetic/svbn.me
secrets:
  - fa3c2c3e-b38e-4807-81ca-72b32e572f88
tasks:
  - build: |
      cd svbn.me
      hugo --minify
      tar -C public -cvz . > site.tar.gz
  - upload: |
      acurl -f https://pages.sr.ht/publish/$site -Fcontent=@site.tar.gz
