# Spindle pipeline for tangled.org, mirroring .github/workflows/ci.yaml. While
# both forges are live, a change to one belongs in the other.
#
# Tangled's own site hosting has no custom-domain support yet, so this deploys
# to xmit exactly as the GitHub workflow does rather than serving from Tangled.

when:
  - event: ["push", "manual"]
    branch: ["main"]
  - event: ["pull_request"]
    branch: ["main"]

engine: "nixery"

clone:
  # hugo.toml sets enableGitInfo, so Hugo dates each page from its last commit
  # and the Atom feeds publish that as <updated>. Spindle's default depth of 1
  # would leave only the tip commit and date every page to the deploy. There is
  # no "full clone" option -- depth 0 is read as the default 1 -- so this is
  # just a number comfortably above the repo's commit count (969 today).
  depth: 10000

# The nixery engine always adds bash, git, coreutils and nix, so those are
# left out here even though the build uses all of them.
dependencies:
  nixpkgs:
    - just
    # rsvg-convert, for the icons `just build` rasterizes from the SVG favicon.
    - librsvg
    # npx, to run xmit in the publish step below.
    - nodejs
    # TLS for the npm registry and the xmit API.
    - cacert
  # Not from the `nixpkgs` key above: nixery.tangled.sh pins its own, older
  # nixpkgs and serves hugo 0.152.2, which predates the css.Build that
  # layouts/_partials/head.html calls -- the site fails to render on it. Any
  # key that isn't `nixpkgs` is installed with `nix profile add '<ref>#<pkg>'`
  # instead, so this pulls hugo from a pinned nixos-unstable revision that has
  # 0.165.0, the version the GitHub workflow pins. nixpkgs builds hugo with the
  # `extended` tag, matching `extended: true` there.
  #
  # To bump: take a revision from https://channels.nixos.org/nixos-unstable
  # (Hydra-built, so hugo substitutes from cache.nixos.org rather than building
  # from source) and check its pkgs/by-name/hu/hugo/package.nix.
  github:nixos/nixpkgs/9fbb54b33e91ee4ca368e35a78e0613c720600b3:
    - hugo

steps:
  # Build on every trigger, exactly as `just publish` would, so what's verified
  # is what ships: minified, with the apple-touch-icon rasterized.
  - name: "Build"
    command: just build

  - name: "Publish"
    environment:
      # xmit ships both a Go release binary and an npm package. The binary is
      # dynamically linked against /lib64/ld-linux-x86-64.so.2, which doesn't
      # exist in a Nix-store-only image, so it dies with exit 127. The npm
      # package is pure JavaScript (axios + tar) and has no such problem, so
      # unlike the GitHub workflow this deploys through npx.
      XMIT_VERSION: "0.5.2-0"
    # XMIT_KEY comes from the repository's Settings -> Secrets.
    command: |
      set -euo pipefail

      # Spindle has no per-step condition, so branch here: a pull request
      # should build but not deploy.
      if [ "${TANGLED_PIPELINE_KIND}" != "push" ]; then
        echo "pipeline kind is ${TANGLED_PIPELINE_KIND}; skipping publish"
        exit 0
      fi

      # npx needs a writable HOME for its cache; the container sets none.
      export HOME="${PWD}/.ci-home"
      mkdir -p "${HOME}" bin

      # A shim rather than a direct npx call, so that the domain to deploy to
      # stays written down once, in the justfile.
      printf '#!/bin/sh\nexec npx --yes "@xmit.co/xmit@%s" "$@"\n' \
        "${XMIT_VERSION}" > bin/xmit
      chmod +x bin/xmit

      # Uploads public/ from the build step rather than rebuilding it.
      PATH="${PWD}/bin:${PATH}" just upload
