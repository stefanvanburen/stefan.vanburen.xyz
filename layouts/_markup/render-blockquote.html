{{- /* A quote with a source becomes a <figure>, so the attribution is part of
       the quote rather than a stray paragraph after it. Everything else stays
       a plain <blockquote>.

       `source` is markdown — normally a link to the work, whose title belongs
       in <cite>. Written as a link rather than a bare `cite` URL so rumdl's
       MD034 stays on for the rest of the file. */ -}}
{{- with .Attributes.source -}}
	<figure>
		<blockquote>
			{{ $.Text }}
		</blockquote>
		<figcaption>
			<small><cite>{{ $.Page.RenderString (dict "display" "inline") . }}</cite></small>
		</figcaption>
	</figure>
{{- else -}}
	<blockquote>{{ .Text }}</blockquote>
{{- end -}}
