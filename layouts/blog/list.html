{{ define "main" }}
<h1>Blog <a class="text-sm" href="/blog/index.xml">(Feed)</a></h1>

<ol class="post-list">
  {{ range .Pages.ByDate.Reverse }}
  <li>
    <i><time datetime={{ .Date.Format "2006-01-02" }} class="nums mr-1">{{ .Date.Format "2006-01-02" }}</time></i>
    <a href="{{.RelPermalink}}">{{ .Title }}</a>
  </li>
  {{ end }}
</ol>
{{ end }}
