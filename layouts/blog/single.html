{{ define "header_extra" }}
  {{ if .Date }}
  <meta property="article:published_time" content="{{ .Date }} "/>
  {{ end }}
{{ end }}

{{ define "main" }}
<article>
  <a href="/blog" class="back-link">⇠ back to posts</a>

  {{ if .Date }}
  <time
    class="text-sm text-grey"
    datetime={{ .Date.Format "2006-01-02" }}
  >{{ .Date.Format "January 2, 2006" }}</time>
  {{ end }}

  <h1>{{ .Title }}</h1>

  {{ .Content }}

  <footer>
    <hr>
    <p class="text-sm">
      Thoughts?
      Corrections?
      Feel free to <a href="mailto:stefan@vanburen.xyz?subject={{ .Title }}">reply via email</a>!
    </p>
  </footer>
</article>
{{ end }}
