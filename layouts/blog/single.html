{{/* vim: set filetype=gohtmltmpl: */}}

{{ define "header_extra" }}
<meta property="article:published_time" content="{{ .Date }}"/>
{{ end }}

{{ define "main" }}
<article>
  <a href="/blog" class="back-link">⇠ back to blog posts</a>

  <h1>{{ .Title }}</h1>

  {{ .Content }}

  <hr>

  <p class="text-sm">
    {{ partial "article-footer" . }}
  </p>

  <time
    class="text-sm text-grey"
    datetime={{ .Date.Format "2006-01-02" }}
  >{{ .Date.Format "January 2, 2006" }}</time>
</article>
{{ end }}
