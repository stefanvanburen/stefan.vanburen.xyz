{{ define "header_extra" }}
  {{ if .Date }}
  <meta property="article:published_time" content="{{ .Date }} "/>
  {{ end }}
{{ end }}

{{ define "main" }}
<article>
  {{ if .Date }}
  <time
    class="text-sm text-grey"
    datetime={{ .Date.Format "2006-01-02" }}
  >{{ .Date.Format "January 2, 2006" }}</time>
  {{ end }}

  <h1>{{ .Title }}</h1>

  {{ .Content }}
</article>

<hr>
<a href="mailto:me@svbn.me?subject={{ .Title }}">Reply via email</a>
{{ end }}
