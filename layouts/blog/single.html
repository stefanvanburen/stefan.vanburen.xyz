{{ define "head_extra" }}
<meta property="article:published_time" content="{{ .Date.Format "2006-01-02T15:04:05Z07:00" }}"/>
{{ end }}

{{ define "main" }}
<a href="/blog" class="back-link">back to blog posts</a>

<article>
  <h1>{{ .RenderString (dict "display" "inline") .Title }}</h1>

  {{ .Content }}
</article>

{{/* Ensure the inline time element is separate from an ending inline element */}}
<div>
  <i><time
    class="text-sm"
    datetime="{{ .Date.Format "2006-01-02" }}"
  >{{ .Date.Format "January 2, 2006" }}</time></i>
</div>

{{ end }}
