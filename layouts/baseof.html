<!DOCTYPE html>
<html lang="en">
  <head>
    {{ partial "head.html" . }}
    {{ block "head_extra" . }}{{ end }}
  </head>
  <body>
    {{ $faviconTemplate := resources.Get "favicon-template.svg" -}}
    {{ $favicon := $faviconTemplate | resources.Minify | resources.ExecuteAsTemplate "favicon.svg" . -}}
    <header class="site-header">
      <a href="/" aria-label="Home"><img src="{{ $favicon.Permalink }}" width="32" height="32" alt=""></a>
      <nav aria-label="Site">
        <a href="/blog" {{ if eq .Section "blog" }}aria-current="page"{{ end }}>blog</a>
        <a href="/til" {{ if eq .Section "til" }}aria-current="page"{{ end }}>TIL</a>
        <a href="/colophon" {{ if strings.HasPrefix .RelPermalink "/colophon" }}aria-current="page"{{ end }}>colophon</a>
        <a href="/now" {{ if strings.HasPrefix .RelPermalink "/now" }}aria-current="page"{{ end }}>now</a>
        <a href="/uses" {{ if strings.HasPrefix .RelPermalink "/uses" }}aria-current="page"{{ end }}>uses</a>
        <a href="/art" {{ if strings.HasPrefix .RelPermalink "/art" }}aria-current="page"{{ end }}>art</a>
        <a href="/resume" {{ if strings.HasPrefix .RelPermalink "/resume" }}aria-current="page"{{ end }}>resume</a>
      </nav>
    </header>
    <main>
      {{ block "main" . }}{{ end }}
    </main>
  </body>
</html>
