{{ define "main" }}
<h1>{{ .Title }}</h1>
{{ .Content }}

{{ with .GitInfo }}
<p>
  <small>
    Last updated:
    <time datetime="{{ .CommitDate.Format "2006-01-02" }}">
      {{ .CommitDate.Format "January _2, 2006" }}
    </time>
  </small>
</p>
{{ end }}

<p>
  <small class="text-sm">
    Based on <a href="https://nownownow.com/">nownownow.com</a>.
  </small>
</p>

{{ with .Params.picture }}
<figure>
  <img
    src="{{ .src }}"
    alt="{{ .caption }}"
    width="{{ .width }}"
    height="{{ .height }}"
    loading="lazy"
  />
  <figcaption>
    <a href="{{ .detailsURL }}">{{ .caption }}</a>
  </figcaption>
</figure>
{{ end }}

{{ end }}
