{{ define "main" }}
<h1>{{ .Title }}</h1>
{{ .Content }}

{{ with .GitInfo }}
<p>
  <small>
    Last updated:
    <time datetime="{{ .CommitDate.Format "2006-01-02" }}">
      {{ .CommitDate.Format "January _2, 2006" }}
    </time>
  </small>
</p>
{{ end }}

<p>
  <small class="text-sm text-grey">
    Based on <a href="https://nownownow.com/">nownownow.com</a>.
  </small>
</p>

{{ $image := resources.GetRemote "https://mdl.artvee.com/sdl/935615ilsdl.jpg" }}
{{ with $image }}
<figure>
  <img
    src="{{ .RelPermalink }}"
    alt="Ipswich Town, or Harbor Scene by Arthur Wesley Dow"
  />
  <figcaption>
    <a href="https://artvee.com/dl/ipswich-town-or-harbor-scene">
      Ipswich Town, or Harbor Scene by Arthur Wesley Dow
    </a>
  </figcaption>
</figure>
{{ end }}

{{ end }}
