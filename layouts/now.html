{{ define "main" }}
<h1>{{ .Title }}</h1>
{{ .Content }}

{{ with .GitInfo }}
<p>
  <small>
    Last updated:
    <time datetime="{{ .CommitDate.Format "2006-01-02" }}">
      {{ .CommitDate.Format "January _2, 2006" }}
    </time>
  </small>
</p>
{{ end }}

<p>
  <small>
    Based on <a href="https://nownownow.com/">nownownow.com</a>.
  </small>
</p>

{{ with .Params.picture }}
<figure>
  <div class="img-wrap">
    <img
      src="{{ .src }}"
      alt="{{ .caption }}"
      width="{{ .width }}"
      height="{{ .height }}"
      loading="eager"
    />
  </div>
  <figcaption>
    <small><a href="{{ .detailsURL }}">{{ .caption }}</a></small>
  </figcaption>
</figure>
{{ end }}

{{ end }}
