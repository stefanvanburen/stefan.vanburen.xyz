{{ define "head_extra" }}
<meta property="article:published_time" content="{{ .Date }}"/>
{{ end }}

{{ define "main" }}
<a href="/til" class="back-link">back to TILs</a>

<article>
  <h1>{{ .Title }}</h1>

  {{ .Content }}
</article>

{{/* Ensure the inline time element is separate from an ending inline element */}}
<div>
  <time
    class="text-sm text-grey"
    datetime={{ .Date.Format "2006-01-02" }}
  >{{ .Date.Format "January 2, 2006" }}</time>
</div>

{{ end }}
