{{ define "main" }}
<h1>{{ .Title }}</h1>
{{ .Content }}

{{ range hugo.Data.art.images }}
<figure>
  <img
    src="{{ .imageURL }}"
    alt="{{ .caption }}"
    width="{{ .width }}"
    height="{{ .height }}"
    loading="lazy"
  />
  <figcaption>
    <small>
      <a href="{{ .detailsURL }}">{{ .caption }}</a>
      <a href="{{ .siteLocation }}">{{ .siteInfo }}</a>
    </small>
  </figcaption>
</figure>
{{ end }}

{{ end }}
