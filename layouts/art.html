{{ define "main" }}
<h1>{{ .Title }}</h1>
{{ .Content }}

{{ range $i, $img := hugo.Data.art.images }}
<figure>
  <div class="img-wrap">
    <img
      src="{{ $img.imageURL }}"
      alt="{{ $img.caption }}"
      width="{{ $img.width }}"
      height="{{ $img.height }}"
      loading="{{ if eq $i 0 }}eager{{ else }}lazy{{ end }}"
    />
  </div>
  <figcaption>
    <small>
      <a href="{{ $img.detailsURL }}">{{ $img.caption }}</a>
      <a href="{{ $img.siteLocation }}">{{ $img.siteInfo }}</a>
    </small>
  </figcaption>
</figure>
{{ end }}

{{ end }}
