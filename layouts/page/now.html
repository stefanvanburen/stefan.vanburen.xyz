{{/* vim: set filetype=gohtmltmpl: */}}

{{ define "main" }}
<h1>{{ .Title }}</h1>
{{ .Content }}

{{ $image := resources.GetRemote "https://media.tate.org.uk/art/images/work/N/N01/N01615_10.jpg" }}
{{ $image := $image.Resize "400x" }}
{{ with $image }}
<img
  src="{{ .RelPermalink }}"
  width="{{ .Width }}"
  height="{{ .Height }}"
  alt="'Carnation, Lily, Lily, Rose', by John Singer Sargent"
>
{{ end }}

{{ end }}
