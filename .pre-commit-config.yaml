repos:
  - repo: local
    hooks:
      - id: stylelint
        name: stylelint
        description: Runs stylelint on assets/*.css files.
        entry: npx stylelint
        language: system
        types: [css]
        files: ^assets/
        pass_filenames: true
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.5.0
    hooks:
      - id: markdownlint-cli2
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
      - id: trailing-whitespace
      - id: check-toml
      - id: end-of-file-fixer
