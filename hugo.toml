# https://gohugo.io/getting-started/configuration/
locale = "en-us"
title = "Stefan VanBuren"
baseURL = "https://stefan.vanburen.xyz/"
copyright = "Stefan VanBuren"
enableGitInfo = true

disableKinds = ["taxonomy", "term"]
mainSections = ["blog", "notes", "til"]

[mediaTypes."application/atom+xml"]
suffixes = ["xml"]
delimiter = "."

[outputFormats.Atom]
mediaType = "application/atom+xml"
baseName = "index"
isPlainText = true
rel = "alternate"

[outputs]
home = ["HTML", "Atom"]
section = ["HTML", "Atom"]
page = ["HTML"]

# Only affects `hugo server`; has no effect on the built output.
[server]
[[server.headers]]
for = "**/index.xml"
[server.headers.values]
Content-Type = "application/atom+xml; charset=utf-8"

[params.author]
# for feeds
name = "Stefan VanBuren"
email = "stefan@vanburen.xyz"

[markup]
[markup.highlight]
# Emit bare CSS classes (.chroma .k, …) instead of inline RGB styles, so our
# own CSS supplies the colors — see assets/chroma.css.
noClasses = false

[markup.goldmark]
[markup.goldmark.renderer]
# allows for inline HTML
unsafe = true

[markup.goldmark.parser.attribute]
# Lets a blockquote carry `{source="…"}`, which the blockquote render hook
# turns into a <figure> with an attributed <figcaption>.
block = true

[markup.goldmark.extensions.extras]
# Markdown syntax for the elements GFM leaves out: ++ins++, ==mark==, ^sup^.
# Subscript stays off — GFM strikethrough already claims a single ~, so `~2~`
# renders as <del>, not <sub>. Write <sub> as inline HTML.
[markup.goldmark.extensions.extras.insert]
enable = true
[markup.goldmark.extensions.extras.mark]
enable = true
[markup.goldmark.extensions.extras.superscript]
enable = true
