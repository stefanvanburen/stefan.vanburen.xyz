languageCode = "en-us"
title = "Stefan VanBuren"
baseurl = "https://stefan.vanburen.xyz/"
copyright = "Stefan VanBuren ©️ 2021 — BY-NC-SA 4.0"
description = "Stefan VanBuren's personal site."

disableKinds = ["taxonomy", "term"]

[author]
  # for RSS
  name = "Stefan VanBuren"

[markup]
  [markup.highlight]
    style = "bw"
  [markup.goldmark]
    [markup.goldmark.extensions]
      # we can't use this because it emits bad HTML for the RSS feed.
      typographer = false
    [markup.goldmark.renderer]
      # allows for inline HTML
      unsafe = true
